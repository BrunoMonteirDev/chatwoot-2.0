server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32m;

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /bridge/ {
    proxy_pass http://bridge:3100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The Super Admin console is rendered by Rails. Its Vite and Sprockets
  # bundles live alongside the SPA's /assets files, so serve local SPA assets
  # first and proxy only files that do not exist in the frontend image.
  location /assets/ { try_files $uri @rails_assets; }
  location @rails_assets { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /vite/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /packs/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /brand-assets/ { try_files $uri @rails_brand_assets; }
  location @rails_brand_assets { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }

  location /api/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /auth/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # ActiveStorage URLs returned by Chatwoot use /rails/active_storage/.
  # Without this proxy Nginx serves the SPA index instead of the attachment.
  location /rails/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /cable { proxy_pass http://rails:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  # The platform console root is /super_admin (without a trailing slash).
  # Proxy it explicitly so the SPA fallback does not intercept the request.
  location = /super_admin { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /super_admin/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
  # A new installation creates its first account and Super Admin here. It is
  # a Rails view, not an SPA route.
  location /installation/ { proxy_pass http://rails:3000; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { try_files $uri $uri/ /index.html; }
}
