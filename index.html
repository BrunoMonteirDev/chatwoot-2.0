<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function() {
        try {
          var _fetch = typeof window !== 'undefined' ? window.fetch : undefined;
          function makeSettable(obj, prop) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, prop, {
                configurable: true,
                enumerable: true,
                get: function() { return _fetch; },
                set: function(v) { _fetch = v; }
              });
            } catch (e) {}
          }
          makeSettable(window, 'fetch');
          makeSettable(globalThis, 'fetch');
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeSettable(Window.prototype, 'fetch');
          }
        } catch (e) {}
      })();
    </script>
