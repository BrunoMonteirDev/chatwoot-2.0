name: Publish frontend and bridge images

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bridge/**'
      - 'deploy/**'
      - 'Dockerfile.frontend'
      - 'Dockerfile.bridge'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            dockerfile: Dockerfile.frontend
            image: ghcr.io/brunomonteirdev/chatwoot-2.0-frontend
          - name: bridge
            dockerfile: Dockerfile.bridge
            image: ghcr.io/brunomonteirdev/chatwoot-2.0-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: VITE_BRIDGE_PUBLIC_URL=/bridge
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
